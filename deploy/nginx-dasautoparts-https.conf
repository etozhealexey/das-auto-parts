# Включать только после выпуска сертификата на оба имени.
server {
    listen 80;
    server_name dasautoparts.ru www.dasautoparts.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://dasautoparts.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.dasautoparts.ru;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/dasautoparts.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dasautoparts.ru/privkey.pem;
    return 301 https://dasautoparts.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name dasautoparts.ru;
    ssl_certificate /etc/letsencrypt/live/dasautoparts.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dasautoparts.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
