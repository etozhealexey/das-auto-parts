# Начальная конфигурация: используется до выпуска сертификата.
server {
    listen 80;
    server_name dasautoparts.ru www.dasautoparts.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503 "Das-Auto-Parts is preparing to launch.\n";
        add_header Content-Type text/plain;
    }
}
