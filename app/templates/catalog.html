{% extends 'base.html' %}
{% block title %}Каталоги запчастей — {{ settings.site_name }}{% endblock %}
{% block content %}
<div class="wrap section" style="padding-top:28px;">
  <h1 class="page-title">Каталоги по маркам</h1>
  <div class="brand-panel">
    <div class="brand-grid wide">
      {% for b in brands %}<a href="/catalog/{{ b.slug }}">{{ b.name }}</a>{% endfor %}
    </div>
  </div>
</div>
{% endblock %}
