{% extends 'base.html' %}
{% block title %}{{ title }} — {{ settings.site_name }}{% endblock %}
{% block content %}
<div class="wrap section" style="padding-top:28px;">
  <nav class="breadcrumbs" aria-label="Навигация"><a href="/catalog">Каталог</a></nav>
  <h1 class="page-title">{{ title }}</h1>
  <div class="alert-box info">{{ text }}</div>
  <div class="form-actions" style="margin-top:16px;">
    {% if search_q %}<a class="btn" href="/catalog/search?q={{ search_q|urlencode }}">Найти «{{ search_q }}» в каталоге</a>{% endif %}
    <a class="btn ghost" href="/catalog">Все категории и бренды</a>
  </div>
</div>
{% endblock %}
